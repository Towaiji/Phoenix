[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-lang-cli"
version = "0.1.0"
description = "Phoenix: a statically verified, Python-like language that compiles to C"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Phoenix Contributors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
phoenix = "phoenix.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["phoenix*"]
